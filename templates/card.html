      <article class="project-card" data-project="$id" data-tags="$tags">
        <div class="project-header">
          <h3 class="project-title"><a href="$url">$title</a></h3>
          <span class="project-date"><time datetime="$month">$date_label</time></span>
        </div>
        <div class="project-tags">$badges</div>
        <p class="project-desc">$description</p>
        <div class="project-links">
          <a href="$url">Read case study →</a>
          $links
        </div>
      </article>
